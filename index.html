<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bharat.Pulse — Independent Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="page-home">

<nav>
  <a class="nav-brand" href="/">Bharat<span>.</span>Pulse</a>
  <div class="nav-search-wrap">
    <svg class="nav-search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.099zm-5.242 1.656a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11"/></svg>
    <input type="text" id="search-input" class="nav-search-input" placeholder="Search research…">
  </div>
  <div class="nav-right">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    <a class="nav-subscribe" href="#">Subscribe</a>
  </div>
</nav>

<div class="home-masthead">
  <div class="home-masthead-inner">
    <div class="home-masthead-label">
      <span>Latest Research</span>
    </div>
    <div class="home-masthead-stats" id="home-stats"></div>
  </div>
</div>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-cat="all">All Research</button>
</div>

<main class="home-main">
  <div class="home-grid" id="home-grid"></div>
  <div class="home-empty" id="home-empty" style="display:none">
    <p>No research found matching your search.</p>
  </div>
</main>

<footer>
  <div class="footer-brand">Bharat<span>.</span>Pulse</div>
  <div class="footer-right">Independent &middot; Long-horizon &middot; Data-driven</div>
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
