<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Bharat.Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300;1,8..60,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div class="reading-progress" id="reading-progress"></div>

<nav>
  <a class="nav-brand" href="/">Bharat<span>.</span>Pulse</a>
  <div class="nav-right">
    <a class="nav-back" href="/">&larr; All Research</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
    <a class="nav-subscribe" href="#">Subscribe</a>
  </div>
</nav>

<div id="article-root"></div>

<button class="back-to-top" id="back-to-top" aria-label="Back to top">↑</button>

<footer>
  <div class="footer-brand">Bharat<span>.</span>Pulse</div>
  <div class="footer-right">Independent &middot; Long-horizon &middot; Data-driven</div>
</footer>

<div id="prompt-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-label" id="modal-title">Explore further</span>
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <p class="modal-prompt" id="modal-prompt-text"></p>
    <div class="modal-actions">
      <button class="modal-copy-btn" id="modal-copy">Copy prompt</button>
      <a class="modal-claude-link" href="https://claude.ai" target="_blank" rel="noopener">Open in Claude &rarr;</a>
    </div>
  </div>
</div>

<script type="module" src="/src/article.js"></script>
</body>
</html>
